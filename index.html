<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nurse Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-layout">
    
    <div class="card login-card">
        <div class="text-center mb-4">
            <div class="brand justify-center mb-4" style="font-size: 2rem;">
                <span class="brand-icon">✚</span> MedCore
            </div>
            <h2>Welcome Back</h2>
            <p>Please sign in to access patient data</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">Email ID</label>
                <input type="email" id="email" class="form-input" placeholder="nurse@hospital.com" value="nurse@hospital.com" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" value="password" required>
            </div>

            <div class="form-group flex justify-between items-center">
                <label class="flex items-center gap-2 text-sm text-muted">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="text-sm text-primary" style="color: var(--primary-color);">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
