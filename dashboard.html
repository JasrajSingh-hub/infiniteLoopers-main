<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nurse Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-layout">
    
    <!-- Navbar -->
    <header class="app-header">
        <div class="container nav-container">
            <div class="brand">
                <span class="brand-icon">✚</span> MedCore
            </div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link active">Patients</a>
                <a href="vitals.html" class="nav-link">Vitals Entry</a>
            </nav>
            <div class="user-profile">
                <div class="avatar">NS</div>
                <div class="hidden-mobile">
                    <p class="text-sm font-medium mb-0" style="margin-bottom: 0;">Nurse Sarah</p>
                </div>
                <a href="#" id="logoutBtn" class="text-secondary text-sm" style="margin-left: 1rem;">Logout</a>
            </div>
        </div>
    </header>

    <main class="container" id="dashboard-container" style="padding-top: 2rem; padding-bottom: 2rem; flex: 1;">
        
        <div class="flex justify-between items-center mb-4">
            <h1>Patient Overview</h1>
            <a href="vitals.html" class="btn btn-primary">
                <span>+</span> Log Vitals
            </a>
        </div>

        <!-- Stats Row -->
        <div class="stats-grid">
            <div class="card stat-card">
                <div class="stat-icon blue">👥</div>
                <div>
                    <p class="text-sm text-muted mb-0" style="margin-bottom: 0;">Total Patients</p>
                    <h3 id="stat-total" style="font-size: 1.5rem; margin-bottom: 0;">--</h3>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon red">⚠️</div>
                <div>
                    <p class="text-sm text-muted mb-0" style="margin-bottom: 0;">Critical Attention</p>
                    <h3 id="stat-critical" style="font-size: 1.5rem; margin-bottom: 0; color: var(--danger-color);">--</h3>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon green">✓</div>
                <div>
                    <p class="text-sm text-muted mb-0" style="margin-bottom: 0;">Stable Condition</p>
                    <h3 id="stat-stable" style="font-size: 1.5rem; margin-bottom: 0;">--</h3>
                </div>
            </div>
        </div>

        <!-- Filter/Search Bar (Visual Only for now) -->
        <div class="card mb-4" style="padding: 1rem; display: flex; gap: 1rem;">
            <input type="text" class="form-input" placeholder="Search patients..." style="max-width: 300px;">
            <select class="form-select" style="max-width: 200px;">
                <option>All Wards</option>
                <option>ICU</option>
                <option>General Ward</option>
            </select>
        </div>

        <!-- Patient Grid -->
        <div id="patient-grid" class="patient-grid">
            <!-- Populated by JS -->
        </div>

    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
