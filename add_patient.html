<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient - Nurse Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="main-layout">
    
    <!-- Navbar -->
    <header class="app-header">
        <div class="container nav-container">
            <div class="brand">
                <span class="brand-icon">✚</span> MedCore
            </div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link active">Patients</a>
                <a href="vitals.html" class="nav-link">Vitals Entry</a>
            </nav>
            <div class="user-profile">
                <div class="avatar">NS</div>
                <a href="#" id="logoutBtn" class="text-secondary text-sm" style="margin-left: 1rem;">Logout</a>
            </div>
        </div>
    </header>

    <main class="container" id="add-patient-container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 600px; margin: 0 auto; flex: 1;">
        
        <div class="mb-4">
            <h1>Admit New Patient</h1>
            <p>Enter patient details to add to the dashboard</p>
        </div>

        <div class="card">
            <form id="add-patient-form">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g. Jane Doe" required>
                </div>

                <div class="vitals-row" style="grid-template-columns: 1fr 1fr; border-top: none; padding-top: 0; margin-top: 0; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" id="age" class="form-input" placeholder="e.g. 45" required>
                    </div>
                    <div class="form-group">
                        <label for="gender" class="form-label">Gender</label>
                        <select id="gender" class="form-select">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <div class="vitals-row" style="grid-template-columns: 1fr 1fr; border-top: none; padding-top: 0; margin-top: 0; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="room" class="form-label">Room Number</label>
                        <input type="text" id="room" class="form-input" placeholder="e.g. 101-A" required>
                    </div>
                    <div class="form-group">
                        <label for="diagnosis" class="form-label">Diagnosis / Condition</label>
                        <input type="text" id="diagnosis" class="form-input" placeholder="e.g. Flu" required>
                    </div>
                </div>

                <!-- Initial Vitals (Optional) -->
                <div class="mt-4 mb-4">
                    <h4 class="mb-2 text-sm text-muted">Initial Vitals (Optional)</h4>
                    <div class="vitals-row" style="grid-template-columns: 1fr 1fr; border-top: 1px dashed var(--border-color); padding-top: 1rem; margin-top: 0; gap: 1.5rem;">
                         <div class="form-group">
                            <label for="bp" class="form-label">BP</label>
                            <input type="text" id="bp" class="form-input" placeholder="120/80">
                        </div>
                        <div class="form-group">
                            <label for="hr" class="form-label">Heart Rate</label>
                            <input type="number" id="hr" class="form-input" placeholder="72">
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 justify-between mt-4">
                    <a href="dashboard.html" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="min-width: 150px;">Admit Patient</button>
                </div>
            </form>
        </div>

    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
